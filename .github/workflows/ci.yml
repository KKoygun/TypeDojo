name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Harness tests
        run: npm test

      - name: meta.json schema
        run: npm run check:meta

      - name: README topic table is generated from meta.json
        run: npm run readme -- --check

      # Validated topics only: reference passes, untouched template fails
      - name: Validate challenges
        run: npm run validate

      # No AI calls: proves every golden case passes its runtime tests
      - name: Golden set premise
        run: npm run ai:eval -- --check

      # No AI calls, no keys: replays the committed recordings. Fails if a prompt,
      # case or challenge changed and the recordings were not re-made.
      - name: Golden set agreement (recorded)
        run: npm run ai:eval
